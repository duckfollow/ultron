[package]
name = "ultron"
version = "0.1.0-alpha.1"
edition = "2021"
description = "A focused local terminal for macOS"
license = "MIT"
repository = "https://github.com/duckfollow/ultron"
[lib]
name = "ultron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[[bin]]
name = "Ultron"
path = "src/main.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
semver = "1"
tauri = { version = "2", features = [] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

serde_json = "1"
tauri-plugin-dialog = "2"

keyring = { version = "=3.6.3", features = ["apple-native"] }
